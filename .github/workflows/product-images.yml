name: Build product image catalog

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  product-images:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache background-removal model
        uses: actions/cache@v4
        with:
          path: ~/.rembg
          key: rembg-u2netp-v2

      - name: Install image pipeline dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          python -m pip install --upgrade pip
          python -m pip install 'rembg[cpu]' pillow requests beautifulsoup4

      - name: Build current catalog
        run: python3 build.py

      - name: Resolve 160 semi-strict product images
        run: python3 tools/fetch_product_images_v6.py

      - name: Build site with semi-strict image mapping
        run: python3 build.py

      - name: Audit sources, identity evidence, canvas and review queue
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import urlparse
          from PIL import Image

          root=Path('.')
          policy=json.loads((root/'source/product-image-policy.json').read_text())
          report=json.loads((root/'source/product-images-report.json').read_text())
          mapping=json.loads((root/'source/product-images.json').read_text())
          version=policy['validation_version']
          approved={k.upper():[x.lower() for x in v] for k,v in policy.get('approved_sources',{}).items()}
          marketplaces=[x.lower() for x in policy.get('marketplace_sources',[])]
          blocked=[x.lower() for x in policy.get('blocked_sources',[])]
          def matches(host,domains): return any(host==d or host.endswith('.'+d) for d in domains)
          def compact(s): return re.sub(r'[^A-Z0-9]','',str(s).upper())
          def watts(s): return {m.group(1).replace(',','.') for m in re.finditer(r'\b(\d+(?:[.,]\d+)?)\s*W\b',str(s),re.I)}
          def ccts(s): return {m.group(1) for m in re.finditer(r'\b(\d{4})\s*K\b',str(s),re.I)}

          assert report['validation_version']==version
          assert report['mode']=='semi_strict'
          assert report['resolved']+report['unresolved_count']==report['total']==160
          review=json.loads((root/'source/product-images-review.json').read_text())
          assert len(review['needs_review'])==report['unresolved_count']

          checked=0
          for slug,v in mapping.items():
              if v.get('status')!='resolved' or v.get('validation_version')!=version:
                  continue
              brand=str(v.get('brand','')).upper()
              host=(urlparse(v['source_page']).hostname or '').lower().removeprefix('www.')
              tier=v.get('source_tier')
              evidence=str(v.get('evidence_title',''))+' '+str(v.get('source_page',''))
              assert not matches(host,blocked), (slug,host)
              if tier=='official':
                  assert matches(host,approved.get(brand,[])), (slug,host,brand)
              elif tier=='marketplace':
                  assert matches(host,marketplaces), (slug,host)
              else:
                  assert tier=='independent', (slug,tier)

              models=v.get('model_tokens') or []
              if models:
                  ce=compact(evidence)
                  assert any(m in ce for m in models), (slug,'missing exact model evidence')
              else:
                  # Without a model code, brand plus numeric specification is mandatory.
                  assert brand in evidence.upper() or tier=='official', (slug,'missing brand evidence')
                  pw,ew=watts(v.get('name','')),watts(evidence)
                  pk,ek=ccts(v.get('name','')),ccts(evidence)
                  if pw: assert pw & ew, (slug,'missing watt evidence')
                  if pk: assert pk & ek, (slug,'missing CCT evidence')

              img=Image.open(root/'source'/v['file']).convert('RGB')
              assert img.size==(1200,1200), (slug,img.size)
              pts=[(0,0),(1199,0),(0,1199),(1199,1199),(600,0),(600,1199),(0,600),(1199,600)]
              assert all(min(img.getpixel(p))>=248 for p in pts), slug
              checked+=1
          assert checked==report['resolved']
          print(f"Semi-strict verified: {report['resolved']} / 160")
          print(f"Resolver: {report.get('resolver','legacy')}")
          print(f"Source tiers: {report.get('source_tiers',{})}")
          print(f"Engines: {report.get('engines',{})}")
          print(f"Held for review: {report['unresolved_count']}")
          PY

      - name: Commit verified library and review queue
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A source/product-images source/product-images.json source/product-images-report.json source/product-images-review.json
          if git diff --cached --quiet; then
            echo 'No semi-strict product-image changes to commit.'
          else
            git commit -m 'Rebuild semi-strict product image library'
            git fetch origin main
            if ! git rebase origin/main; then
              git checkout --theirs source/product-images source/product-images.json source/product-images-report.json source/product-images-review.json
              git add -A source/product-images source/product-images.json source/product-images-report.json source/product-images-review.json
              GIT_EDITOR=true git rebase --continue
            fi
            git push origin HEAD:main
          fi

      - name: Semi-strict completion summary
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('source/product-images-report.json').read_text())
          print(f"Published validated images: {r['resolved']}")
          print(f"Source tiers: {r.get('source_tiers',{})}")
          print(f"Engines: {r.get('engines',{})}")
          print(f"Intentionally withheld images: {r['unresolved_count']}")
          PY
