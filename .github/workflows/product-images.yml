name: Build product image catalog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/fetch_product_images.py'
      - 'tools/apply_product_images.py'
      - 'source/product-image-policy.json'
      - '.github/workflows/product-images.yml'

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  product-images:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache background-removal model
        uses: actions/cache@v4
        with:
          path: ~/.rembg
          key: rembg-u2netp-v2

      - name: Install image pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'rembg[cpu]' pillow requests beautifulsoup4

      - name: Build current catalog
        run: python3 build.py

      - name: Resolve only strictly verified product images
        shell: bash
        run: |
          set -euo pipefail
          # Re-run unresolved items because official sites can be intermittent.
          for pass in 1 2 3; do
            echo "=== strict image validation pass $pass ==="
            python3 tools/fetch_product_images.py
            unresolved=$(python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('source/product-images-report.json')
          print(json.loads(p.read_text()).get('unresolved_count',160) if p.exists() else 160)
          PY
            )
            echo "Held for review after pass $pass: $unresolved"
            if [ "$unresolved" -eq 0 ]; then break; fi
            sleep $((pass * 10))
          done

      - name: Build site with strict image mapping
        run: python3 build.py

      - name: Audit sources, canvas and review queue
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse
          from PIL import Image

          root=Path('.')
          policy=json.loads((root/'source/product-image-policy.json').read_text())
          report=json.loads((root/'source/product-images-report.json').read_text())
          mapping=json.loads((root/'source/product-images.json').read_text())
          version=policy['validation_version']
          approved={k.upper():[x.lower() for x in v] for k,v in policy['approved_sources'].items()}
          assert report['validation_version']==version
          assert report['mode']=='strict'
          assert report['resolved']+report['unresolved_count']==report['total']==160
          review=json.loads((root/'source/product-images-review.json').read_text())
          assert len(review['needs_review'])==report['unresolved_count']

          checked=0
          for slug,v in mapping.items():
              if v.get('status')!='resolved' or v.get('validation_version')!=version:
                  continue
              brand=str(v.get('brand','')).upper()
              host=(urlparse(v['source_page']).hostname or '').lower().removeprefix('www.')
              allowed=approved.get(brand,[])
              assert allowed and any(host==d or host.endswith('.'+d) for d in allowed), (slug,host,brand)
              img=Image.open(root/'source'/v['file']).convert('RGB')
              assert img.size==(1200,1200), (slug,img.size)
              # White border proves the product has breathing room and cannot touch the canvas edge.
              pts=[(0,0),(1199,0),(0,1199),(1199,1199),(600,0),(600,1199),(0,600),(1199,600)]
              assert all(min(img.getpixel(p))>=248 for p in pts), slug
              checked+=1
          assert checked==report['resolved']
          print(f"Strict verified: {report['resolved']} / 160")
          print(f"Held for manual/source review: {report['unresolved_count']}")
          PY

      - name: Commit verified library and review queue
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A source/product-images source/product-images.json source/product-images-report.json source/product-images-review.json
          if git diff --cached --quiet; then
            echo 'No strict product-image changes to commit.'
          else
            git commit -m 'Rebuild strict verified product image library'
            git pull --rebase origin main
            git push origin main
          fi

      - name: Strict-mode completion summary
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('source/product-images-report.json').read_text())
          print(f"Published verified images: {r['resolved']}")
          print(f"Intentionally withheld images: {r['unresolved_count']}")
          print('Unverified images are never published; website uses a verification placeholder instead.')
          PY
