name: Build product image catalog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/fetch_product_images.py'
      - 'tools/apply_product_images.py'
      - '.github/workflows/product-images.yml'

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  product-images:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Cache background-removal model
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-u2netp-v1

      - name: Install image pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'rembg[cpu]' pillow requests beautifulsoup4

      - name: Build current catalog
        run: python3 build.py

      - name: Find, remove backgrounds and normalize all product images
        shell: bash
        run: |
          set -euo pipefail
          # Multiple passes retry only unresolved products. This helps with
          # intermittent search-engine throttling and temporary source errors.
          for pass in 1 2 3 4; do
            echo "=== image resolution pass $pass ==="
            python3 tools/fetch_product_images.py
            unresolved=$(python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('source/product-images-report.json')
          print(json.loads(p.read_text()).get('unresolved_count',160) if p.exists() else 160)
          PY
            )
            echo "Unresolved after pass $pass: $unresolved"
            if [ "$unresolved" -eq 0 ]; then break; fi
            sleep $((pass * 12))
          done

      - name: Verify images can be applied to the site
        run: |
          python3 build.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('source/product-images-report.json').read_text())
          print(f"Resolved {report['resolved']} / {report['total']} product images")
          print(f"Unresolved: {report['unresolved_count']}")
          if report['resolved']:
              assert Path('dist/assets/products').exists()
          PY

      - name: Commit image library and source audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/product-images source/product-images.json source/product-images-report.json
          if git diff --cached --quiet; then
            echo 'No product-image changes to commit.'
          else
            git commit -m 'Add normalized product catalog images'
            git pull --rebase origin main
            git push origin main
          fi

      - name: Completion gate
        shell: bash
        run: |
          unresolved=$(python3 - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('source/product-images-report.json').read_text())['unresolved_count'])
          PY
          )
          if [ "$unresolved" -ne 0 ]; then
            echo "::error::$unresolved SKU images remain unresolved; see source/product-images-report.json"
            exit 1
          fi
          echo 'All launch SKUs now have normalized product images.'
