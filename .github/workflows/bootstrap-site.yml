name: Build PRATAMA website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build static website
        run: python3 build.py

      - name: Verify generated site
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          dist = Path('dist')
          pages = list(dist.rglob('*.html'))
          products = json.loads((dist / 'data/products.json').read_text())
          assert len(pages) == 189, f'Expected 189 HTML pages, got {len(pages)}'
          assert len(products) == 160, f'Expected 160 products, got {len(products)}'
          assert (dist / 'index.html').exists()
          assert (dist / 'sitemap.xml').exists()
          assert (dist / 'robots.txt').exists()
          public = '\n'.join(p.read_text(errors='ignore') for p in pages)
          assert 'HPP' not in public
          print(f'PASS: {len(pages)} HTML pages, {len(products)} products')
          PY
