name: Bootstrap Pratama website

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/site.part.*'
      - 'bootstrap/READY'

permissions:
  contents: write

jobs:
  expand-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check payload completeness
        id: payload
        shell: bash
        run: |
          count=$(find bootstrap -maxdepth 1 -type f -name 'site.part.*' 2>/dev/null | wc -l)
          if [ "$count" -eq 6 ] && [ -f bootstrap/READY ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo "Payload not complete yet ($count/6 parts)."
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Expand final website source
        if: steps.payload.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/site.part.* | base64 -d > /tmp/pratama-site.tar.gz
          tar -xzf /tmp/pratama-site.tar.gz -C .
          rm -rf bootstrap

      - name: Commit expanded website
        if: steps.payload.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Publish final Pratama website UI/UX'
          git push origin main
