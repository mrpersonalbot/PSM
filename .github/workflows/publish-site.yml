name: Build and publish Pratama site

on:
  push:
    branches: [main]
    paths:
      - 'build.py'
      - 'source/**'
      - '.github/workflows/publish-site.yml'

permissions:
  contents: write

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build static site
        run: python3 build.py

      - name: Validate generated site
        shell: bash
        run: |
          set -euo pipefail
          if [ -d dist ]; then
            site_root=dist
          else
            site_root=.
          fi
          echo "Site root: $site_root"
          html_count=$(find "$site_root" -type f -name '*.html' | wc -l)
          product_count=$(find "$site_root/produk" -mindepth 2 -maxdepth 2 -type f -name index.html | wc -l)
          echo "HTML pages: $html_count"
          echo "Product pages: $product_count"
          test "$html_count" -eq 189
          test "$product_count" -eq 160
          grep -q 'operated by PT Pratama Sukses Mandiri' "$site_root/index.html"
          grep -q 'PRATAMA MITRA' "$site_root/index.html"
          grep -qi '#0a498b' "$site_root/assets/styles.css"

      - name: Remove temporary bootstrap files
        run: |
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-site.yml

      - name: Commit generated website
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Publish final Pratama website UI/UX'
          git push origin main
