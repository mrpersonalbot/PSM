name: Deploy GitHub Pages Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://pratamasuksesmandiri.com
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build website
        run: python3 build.py

      - name: Adapt paths for GitHub Pages subpath
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import urlparse

          base = urlparse(os.environ["SITE_URL"]).path.rstrip("/")

          for path in Path("dist").rglob("*.html"):
              text = path.read_text(encoding="utf-8")
              if base:
                  for attr in ("href", "src", "action"):
                      text = text.replace(f'{attr}="/', f'{attr}="{base}/')
                      text = text.replace(f"{attr}='/", f"{attr}='{base}/")
              path.write_text(text, encoding="utf-8")

          if base:
              css = Path("dist/assets/styles.css")
              text = css.read_text(encoding="utf-8")
              text = text.replace("url('/assets/", f"url('{base}/assets/")
              text = text.replace('url("/assets/', f'url("{base}/assets/')
              css.write_text(text, encoding="utf-8")

          if base:
              js = Path("dist/assets/app.js")
              text = js.read_text(encoding="utf-8")
              text = text.replace("location.href='/produk/", f"location.href='{base}/produk/")
              text = text.replace('location.href="/produk/', f'location.href="{base}/produk/')
              text = text.replace('href="/produk/', f'href="{base}/produk/')
              text = text.replace("href='/produk/", f"href='{base}/produk/")
              js.write_text(text, encoding="utf-8")
          PY

      - name: Validate preview paths
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/assets/styles.css
          test -f dist/assets/pratama-brand-wordmark-home-transparent.png
          test -f dist/assets/pratama-brand-footer-transparent.png
          python3 - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import urlparse

          base = urlparse(os.environ["SITE_URL"]).path.rstrip("/")
          html = Path("dist/index.html").read_text(encoding="utf-8")
          css = Path("dist/assets/styles.css").read_text(encoding="utf-8")
          js = Path("dist/assets/app.js").read_text(encoding="utf-8")
          assert f'href="{base}/assets/styles.css"' in html
          assert f'src="{base}/assets/pratama-brand-wordmark-home-transparent.png"' in html
          assert f'src="{base}/assets/pratama-brand-footer-transparent.png"' in html
          assert f"url('{base}/assets/pratama-logo-white.svg')" in css
          assert f"location.href='{base}/produk/'" in js
          if base:
              assert f"{base}{base}/" not in js
          else:
              assert "/PSM/produk/" not in js
          PY

      - name: Audit product image identity and rendered sources
        run: python3 tools/audit_product_images.py

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
